<svg fill="none" viewBox="0 0 900 460" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .wrapper {
          background-color: #05080e;
          padding: 20px;
          border-radius: 12px;
          display: flex;
          gap: 20px;
          font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
          color: #e6edf3;
          box-sizing: border-box;
          width: 100%;
          min-height: 420px;
        }

        .window {
          background-color: #0b0f17;
          border: 1px solid #1f2937;
          border-radius: 10px;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        .window-left {
          flex: 0 0 320px;
        }

        .window-right {
          flex: 1;
          padding-bottom: 20px;
        }

        .window-header {
          background-color: #111622;
          padding: 10px 14px;
          display: flex;
          align-items: center;
          border-bottom: 1px solid #1f2937;
        }

        .dots {
          display: flex;
          gap: 6px;
        }

        .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
        }

        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .window-title {
          margin-left: auto;
          margin-right: auto;
          font-size: 11px;
          color: #6e7681;
        }

        .content {
          padding: 20px;
        }

        .cmd-line {
          color: #00ff87;
          font-size: 12px;
          margin-bottom: 15px;
        }

        .avatar-svg-box {
          display: flex;
          justify-content: center;
          align-items: center;
          margin-top: 10px;
        }

        .greeting-code {
          color: #79c0ff;
          font-size: 13px;
        }

        .name-title {
          font-size: 26px;
          font-weight: 700;
          color: #ffffff;
          margin: 8px 0;
        }

        .name-title span {
          color: #00ff87;
        }

        .role-title {
          font-size: 17px;
          color: #00ff87;
          font-weight: 600;
          margin-bottom: 18px;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .info-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
          font-size: 12px;
          color: #8b949e;
          margin-bottom: 20px;
        }

        .info-item {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .info-item span.highlight {
          color: #c9d1d9;
        }

        .section-label {
          font-size: 12px;
          font-weight: 600;
          color: #ffffff;
          margin-bottom: 10px;
        }

        .skills-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 20px;
        }

        .skill-pill {
          background-color: #0d131f;
          border: 1px solid #1e293b;
          color: #00ff87;
          padding: 4px 12px;
          border-radius: 15px;
          font-size: 11px;
          font-weight: 500;
        }
      </style>

      <div class="wrapper">
        <!-- Janela Esquerda -->
        <div class="window window-left">
          <div class="window-header">
            <div class="dots">
              <div class="dot dot-red"></div>
              <div class="dot dot-yellow"></div>
              <div class="dot dot-green"></div>
            </div>
            <div class="window-title">meiryanne@avatar:~</div>
          </div>
          <div class="content">
            <div class="cmd-line">meiryanne@avatar:~$ display profile</div>
            <div class="avatar-svg-box">
              <svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
   
              </svg>
            </div>
          </div>
        </div>

        <!-- Janela Direita -->
        <div class="window window-right">
          <div class="window-header">
            <div class="dots">
              <div class="dot dot-red"></div>
              <div class="dot dot-yellow"></div>
              <div class="dot dot-green"></div>
            </div>
            <div class="window-title">meiryanne@terminal:~</div>
          </div>
          <div class="content">
            <div class="greeting-code">const greeting = "Hi 👋";</div>
            <div class="name-title">I'm <span>Meiryanne Martins</span></div>
            <div class="role-title">$&gt; Software &amp; AI Systems Engineer</div>

            <div class="info-list">
              <div class="info-item">📍 <span class="highlight">Location:</span> Brazil · remote-friendly</div>
              <div class="info-item">🤖 <span class="highlight">AI &amp; Data:</span> Agentic AI, Agent Evaluation &amp; RAG Systems</div>
              <div class="info-item">🛠️ <span class="highlight">Backend:</span> Java (Spring Boot), Go, Python &amp; Kafka</div>
              <div class="info-item">✉️ <span class="highlight">Email:</span> meirympereira@gmail.com</div>
            </div>

            <div class="section-label">Skills &amp; Technologies</div>
            <div class="skills-grid">
              <div class="skill-pill">Agentic AI</div>
              <div class="skill-pill">Agent Evaluation</div>
              <div class="skill-pill">Python</div>
              <div class="skill-pill">Java</div>
              <div class="skill-pill">Go</div>
              <div class="skill-pill">Spring Boot</div>
              <div class="skill-pill">Kafka</div>
              <div class="skill-pill">PostgreSQL</div>
              <div class="skill-pill">Docker</div>
              <div class="skill-pill">Kubernetes</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
